<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль кассовой дисциплины</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#5d6570;--line:#dfe3e8;--acc:#b5121b;--ok:#1d7a3a;--okbg:#e7f5ec;--bad:#b5121b;--badbg:#fdecec;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e22;--fg:#e8eaed;--mut:#9aa3ad;--line:#2d3238;--acc:#ff5a5f;--ok:#5fd38a;--okbg:#15291d;--bad:#ff7b7f;--badbg:#341a1b;--chip:#262a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
input[type=password],input[type=text]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;width:260px;max-width:100%}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.sec{background:var(--chip);color:var(--fg)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--acc)}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
video{width:100%;max-height:70vh;background:#000;border-radius:8px}
.sticky{position:sticky;top:12px}
.verdict{font-size:20px;font-weight:600;padding:14px 18px;border-radius:10px;margin-bottom:16px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.v{border-left:4px solid var(--bad)}
.v h3{margin:0 0 6px;font-size:17px}
.tc{display:inline-block;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:1px 8px;font-variant-numeric:tabular-nums;cursor:pointer;font-weight:600}
.tc:hover{border-color:var(--acc)}
.frames{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.frames figure{margin:0}
.frames img{height:220px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.frames figcaption{font-size:12px;color:var(--mut)}
.rule{background:var(--chip);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}
.rule blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);font-style:italic}
.rule a{color:var(--acc)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--bad)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:95vw;max-height:95vh}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Контроль кассовой дисциплины по видео</h1>
  <span class="mut">API-ключ:</span>
  <input id="key" type="password" placeholder="X-API-Key" autocomplete="off">
  <button class="sec" id="saveKey">Сохранить</button>
  <span id="keyState" class="mut"></span>
</header>
<main>
  <div class="card">
    <div class="drop" id="drop">Перетащите видео (.mov) сюда или нажмите, чтобы выбрать файл
      <input type="file" id="file" accept="video/*,.mov" class="hidden"></div>
    <p id="status" class="mut" style="margin:12px 0 0"></p>
  </div>
  <div class="grid hidden" id="out">
    <div class="sticky">
      <div class="card"><video id="player" controls preload="metadata"></video>
        <div class="mut" id="fname" style="font-size:13px;margin-top:6px"></div></div>
    </div>
    <div id="result"></div>
  </div>
</main>
<div id="zoom"><img alt=""></div>
<script>
const $ = id => document.getElementById(id);
let KEY = ""; try { KEY = localStorage.getItem("apiKey") || ""; } catch (e) {}
$("key").value = KEY;
const showKey = () => $("keyState").textContent = KEY ? "ключ сохранён" : "введите ключ";
showKey();
$("saveKey").onclick = () => { KEY = $("key").value.trim(); try { localStorage.setItem("apiKey", KEY); } catch (e) {} showKey(); };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => { t = Number(t); const m = Math.floor(t / 60), s = (t - m * 60).toFixed(1); return `${m}:${s.padStart(4, "0")}`; };
const status = (html, cls) => { $("status").innerHTML = html; $("status").className = cls || "mut"; };

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) start(e.dataTransfer.files[0]); };
$("file").onchange = e => { if (e.target.files[0]) start(e.target.files[0]); };

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {...(opts.headers || {}), "X-API-Key": KEY}});
  if (r.status === 401) throw new Error("Неверный или отсутствующий API-ключ");
  if (!r.ok) throw new Error(`Ошибка сервера ${r.status}: ${await r.text()}`);
  return r.json();
}

let pollTimer = null;
async function start(file) {
  if (!KEY) { KEY = $("key").value.trim(); if (!KEY) { status("Сначала введите API-ключ вверху страницы.", "err"); return; } }
  clearTimeout(pollTimer);
  $("out").classList.remove("hidden");
  $("result").innerHTML = "";
  $("player").src = URL.createObjectURL(file);
  $("fname").textContent = file.name;
  status(`<span class="spin"></span>Загрузка видео (${(file.size / 2**20).toFixed(1)} МБ)…`);
  try {
    const fd = new FormData(); fd.append("file", file);
    const {job_id} = await api("/api/v1/analyze", {method: "POST", body: fd});
    poll(job_id, Date.now());
  } catch (e) { status(esc(e.message), "err"); }
}

async function poll(id, t0) {
  try {
    const j = await api(`/api/v1/jobs/${id}`);
    const sec = Math.round((Date.now() - t0) / 1000);
    if (j.status === "processing") {
      status(`<span class="spin"></span>${j.started ? "Идёт анализ видео" : "В очереди"}… ${sec} с (задача ${esc(id)})`);
      pollTimer = setTimeout(() => poll(id, t0), 2000);
    } else if (j.status === "failed") {
      status(`Анализ не удался: ${esc(j.error)}`, "err");
    } else {
      status(`Готово за ${j.processing_time_sec ?? sec} с · задача ${esc(id)}`);
      render(j);
    }
  } catch (e) { status(esc(e.message), "err"); }
}

function seek(t) { const p = $("player"); p.currentTime = Number(t); p.pause(); p.scrollIntoView({block: "nearest", behavior: "smooth"}); }

function ruleHtml(r) {
  if (!r) return "";
  const cites = (r.citation || "").split(";").map(s => s.trim()).filter(Boolean);
  const links = (r.link || "").split(";").map(s => s.trim()).filter(Boolean);
  const quotes = (r.quote || "").split("|").map(s => s.trim()).filter(Boolean);
  return `<div class="rule"><b>Норма:</b> ${esc(r.act)}<br>
    <b>Пункт:</b> ${cites.map(esc).join("; ")}
    ${quotes.map(q => `<blockquote>«${esc(q)}»</blockquote>`).join("")}
    ${links.map((l, i) => `<a href="${esc(l)}" target="_blank" rel="noopener">Текст на adilet.zan.kz${links.length > 1 ? ` (${esc(cites[i] || i + 1)})` : ""}</a>`).join("<br>")}
    ${r.rule_match && r.rule_match !== "direct" ? `<div class="mut" style="font-size:12px;margin-top:4px">Соответствие норме: ${r.rule_match === "closest" ? "ближайшая применимая норма" : esc(r.rule_match)}</div>` : ""}
  </div>`;
}

function render(j) {
  const vs = j.violations || [];
  let h = j.verdict === "violation"
    ? `<div class="verdict bad">Обнаружены признаки возможных нарушений (${vs.length})</div>`
    : `<div class="verdict ok">Нарушение не обнаружено</div>`;
  vs.forEach((v, i) => {
    const iv = v.interval_sec ? ` <span class="mut">(интервал ${fmt(v.interval_sec[0])}–${fmt(v.interval_sec[1])})</span>` : "";
    h += `<div class="card v">
      <h3>${i + 1}. ${esc(v.type)} ${v.class_id ? `<span class="mut" style="font-weight:400">${esc(v.class_id)}</span>` : ""}</h3>
      <div>Время: <span class="tc" data-t="${v.timecode_sec}" title="Перейти к моменту в видео">${fmt(v.timecode_sec)}</span>
        <span class="mut">(${v.timecode_sec} с)</span>${iv}</div>
      <p style="margin:8px 0">${esc(v.description)}</p>
      <div class="frames">${(v.evidence_frames || []).map(f => `<figure>
        <img src="data:image/jpeg;base64,${f.image_base64}" alt="кадр ${f.timestamp_sec} с">
        <figcaption><span class="tc" data-t="${f.timestamp_sec}">${fmt(f.timestamp_sec)}</span></figcaption></figure>`).join("")}</div>
      ${ruleHtml(v.rule)}
    </div>`;
  });
  h += `<p class="mut" style="font-size:13px">Результат автоматического анализа — признаки возможных нарушений для проверки сотрудником; окончательное решение принимает человек.</p>`;
  $("result").innerHTML = h;
  $("result").querySelectorAll(".tc").forEach(el => el.onclick = () => seek(el.dataset.t));
  $("result").querySelectorAll(".frames img").forEach(el => el.onclick = () => { $("zoom").querySelector("img").src = el.src; $("zoom").style.display = "flex"; });
}
$("zoom").onclick = () => $("zoom").style.display = "none";
</script>
</body>
</html>
